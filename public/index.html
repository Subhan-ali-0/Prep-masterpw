<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep Master</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">PM</div>
      <strong>Prep Master</strong>
    </div>
    <button id="menuBtn" class="menu-btn" aria-label="Menu">⋮</button>
    <div id="menu" class="menu hidden">
      <a href="https://t.me/prepmaster0" target="_blank" rel="noopener">Join Telegram</a>
      <a href="https://t.me/Subhanali011" target="_blank" rel="noopener">Contact Owner</a>
    </div>
  </header>

  <main>
    <section id="batchesPage" class="page">
      <h1>Batches</h1>
      <input id="batchSearch" class="search" placeholder="Search batches..." />
      <div id="batchList" class="batch-grid">
        <p>Loading batches...</p>
      </div>
    </section>

    <section id="myBatchesPage" class="page hidden">
      <h1>My Batches</h1>
      <div id="myBatchList" class="batch-grid"></div>
    </section>

    <section id="communityPage" class="page hidden">
      <h1>Community</h1>
      <p class="muted">Be respectful. Do not share personal information.</p>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="1000" placeholder="Write a message..." required />
        <button type="submit">Send</button>
      </form>
      <p id="chatStatus" class="muted"></p>
    </section>

    <section id="aiPage" class="page hidden">
      <h1>AI Doubts Support</h1>
      <div id="aiMessages" class="ai-messages">
        <div class="bubble bot">Hello! Apna study question poochho.</div>
      </div>
      <form id="aiForm" class="chat-form">
        <input id="aiInput" maxlength="4000" placeholder="Ask your doubt..." required />
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="accountPage" class="page hidden">
      <h1>Account</h1>
      <label for="username">Your community username</label>
      <input id="username" class="search" maxlength="24" placeholder="Enter username" />
      <button id="saveUsername" class="primary-btn">Save username</button>
      <p id="accountStatus" class="muted"></p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-page="accountPage">Account</button>
    <button data-page="communityPage">Community</button>
    <button data-page="batchesPage" class="active">Batches</button>
    <button data-page="myBatchesPage">My Batches</button>
    <button data-page="aiPage">AI Doubts</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
</body>
</html>
